<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

</head>

<body>
    <div class="header">
        <h2>Admin Dashboard</h2>
        <div class="avatar">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTuPFsEQ9N0qw-lHRUMaFcXftBhH1pbvG9Yrd_fJSClnA&s=10"
                alt="">
        </div>
    </div>
    <div class="sidebar">
        <a href="./index.html">🏠Home</a>
        <a href="./order.html">📦Orders</a>
        <a href="./Category.html">Category</a>
        <a href="#">🛒Products</a>
        <a href="./Customer.html">👥Customer</a>
        <a href="./setting.html">⚙Setting</a>
        <a href="#">🚪Logout</a>
    </div>

    <div class="main-content">
        <br><br><br>
        <div class="container">
            <div class="row">
                <div class="col col-lg-8">
                    <!-- <input type="text" class="form-control" placeholder="Enter Category Name "> -->

                </div>
                <div class="col col-lg-4" style="text-align: right;">
                    <button class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#productModal">Add
                        Product</button>
                </div>
            </div>
        </div>

        <div class="table-container">
            <h2>
                Total Products
            </h2>
            <table id="products">
                <tr>
                    <th>S.No</th>
                    <th>product Name</th>
                    <th>Category</th>
                    <th>price</th>
                </tr>
                <tr >
                    <td colspan="4" style="text-align: center;">loading......</td>
                </tr>
               
               
                
               
            </table>

        </div>
    </div>



    <!-- Modal -->
    <div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">Modal title</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <select class="form-select" id="category" aria-label="Default select example">
                        <option selected disabled>Open this select Category</option>
                        
                    </select>
                    <input class="form-control my-4" type="text" placeholder="Enter Product Name" id="pname"/>
                    <input  class="form-control my-4" type="text" placeholder="Enter Product Price" id="pprice"/>
                    <input  class="form-control my-4" type="text" placeholder="Enter Product Desc" id="pdescription"/>
                    <input  class="form-control my-4" type="file"  id="ppicture"/>

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="addNewProduct()">Save changes</button>
                </div>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>


    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

    <script type="module" src="Product.js"></script>
</body>
